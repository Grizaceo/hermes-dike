name: dike
version: "0.6.0"
manifest_version: 2
description: >-
  Checks the article citations of Chilean law in a legal brief against a local,
  hash-identified copy of 25 statutes, and refuses to certify what it cannot prove:
  each citation comes back verified (with its source, text hash and in-force status)
  or unverified with the reason. Offline after install; never signs, never calls a model.
  The web-dashboard tab and the opt-in Desktop sidebar page add a case board (NIF):
  versioned, patch-attributed case theory with human validation — plus a read-only
  map of the sealed corpus graph and the personal review graph. All engine work
  runs in the same isolated subprocess; case data stays in plugin-data, outside
  the sealed corpus generation.
author: Grizaceo
license: MIT
homepage: https://github.com/Grizaceo/hermes-dike
tags: [legal, chile, citations, verification, offline, spanish]
requires_hermes: ">=0.23.0"
platforms: [linux]
provides_tools: [dike_verificar_citas]
provides_hooks: [pre_llm_call, pre_tool_call]
python_dependencies:
  - "pydantic>=2.0,<3"
  - "pyyaml>=6.0,<7"
  - "rich>=13.0,<15"
  - "requests>=2.28,<3"
  - "cryptography>=42.0,<51"
  - "python-docx>=1.1,<2"
