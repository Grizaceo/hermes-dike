name: dike
version: "0.8.1"
manifest_version: 2
description: >-
  Checks the article citations of Chilean law in a legal brief against a local,
  hash-identified copy of 25 statutes, and refuses to certify what it cannot prove:
  each citation comes back verified (with its source, text hash and in-force status)
  or unverified with the reason. The verifier is offline after install, never signs
  and never calls a model. The opt-in Desktop page adds a Case Writer: a brief
  editor with the verifier as a module (prove, repair, withdraw with a reason,
  escalate), a pseudonymization step you see and control before any text leaves,
  and a chat about the brief that runs in your own Hermes gateway (lexo-lawyer by
  default) with two hooks that inject fail-closed instructions and block every tool
  except skills and the verifier, only in those sessions. It also proposes NIF
  case-board updates that enter only when you accept them, plus a read-only map of
  the sealed corpus graph whose content search is lexical, deterministic and
  offline — one clue to read, never a verified citation. Case data stays in
  plugin-data, outside the sealed corpus generation.
author: Grizaceo
license: MIT
homepage: https://github.com/Grizaceo/hermes-dike
tags: [legal, chile, citations, verification, offline, spanish]
requires_hermes: ">=0.23.0"
platforms: [linux]
provides_tools: [dike_verificar_citas, dike_leer_articulo, dike_buscar_corpus]
provides_hooks: [pre_llm_call, pre_tool_call]
python_dependencies:
  - "pydantic>=2.0,<3"
  - "pyyaml>=6.0,<7"
  - "rich>=13.0,<15"
  - "requests>=2.28,<3"
  - "cryptography>=42.0,<51"
  - "python-docx>=1.1,<2"
