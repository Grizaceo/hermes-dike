name: dike
version: "0.9.0"
manifest_version: 2
description: >-
  Checks the article citations of Chilean law in a legal brief against a local,
  hash-identified copy of 25 statutes, and refuses to certify what it cannot prove:
  each citation comes back verified (with its source, text hash and in-force status)
  or unverified with the reason. The engine and panel run inside bubblewrap when
  it is available and declare a degraded mode when it is not; the verifier is
  offline after install, never signs and never calls a model. The opt-in Desktop
  page adds a Case Writer: a brief editor with the verifier as a module (prove,
  repair, withdraw with a reason, escalate), a pseudonymization step you see and
  control before any text leaves, and a chat about the brief that runs in a Hermes
  profile you choose — the active profile by default, or the one set in
  perfil_chat — with two hooks that inject fail-closed instructions and block
  every tool except skills and the verifier, only in those sessions. Chat claims
  about articles carry footnotes that open the exact graph node so you can check
  the text yourself; whether an article is relevant is the model's reading and
  your decision, never the plugin's. It also proposes NIF case-board updates that
  enter only when you accept them, plus a read-only map of the sealed corpus
  graph whose content search is lexical, deterministic and offline — one clue to
  read, never a verified citation. Case data stays in plugin-data, outside the
  sealed corpus generation.
author: Grizaceo
license: MIT
homepage: https://github.com/Grizaceo/hermes-dike
tags: [legal, chile, citations, verification, offline, spanish]
requires_hermes: ">=0.23.0"
platforms: [linux]
provides_tools: [dike_verificar_citas, dike_leer_articulo, dike_buscar_corpus]
provides_hooks: [pre_llm_call, pre_tool_call]
config_schema:
  sandbox:
    type: str
    choices: [auto, requerido]
    default: auto
    label: Aislamiento del motor
    description: >-
      Cómo corre el motor y el panel. «auto» usa bubblewrap cuando está
      disponible y declara el modo degradado si no; cualquier otro valor
      exige el sandbox y falla cerrado si no se puede.
  perfil_chat:
    type: str
    default: ""
    label: Perfil del chat del escrito
    description: >-
      Perfil de Hermes donde corre el chat del escrito; vacío = el perfil
      activo.
python_dependencies:
  - "pydantic>=2.0,<3"
  - "pyyaml>=6.0,<7"
  - "rich>=13.0,<15"
  - "requests>=2.28,<3"
  - "cryptography>=42.0,<51"
