name: dike
version: "0.2.0"
manifest_version: 2
description: >-
  Checks every article citation of Chilean law in a legal brief against a local,
  hash-identified copy of 25 statutes, and refuses to certify what it cannot prove:
  each citation comes back verified (with its source, text hash and in-force window)
  or unverified with the reason. Offline after install; never signs, never calls a model.
author: Grizaceo
license: MIT
homepage: https://github.com/Grizaceo/hermes-dike
tags: [legal, chile, citations, verification, offline, spanish]
requires_hermes: ">=0.22.7"
platforms: [linux]
provides_tools: [dike_verificar_citas]
provides_hooks: []
python_dependencies:
  - "pydantic>=2.0,<3"
  - "pyyaml>=6.0,<7"
  - "rich>=13.0,<15"
  - "requests>=2.28,<3"
  - "cryptography>=42.0,<51"
