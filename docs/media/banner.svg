<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0f1115"/>
  <rect x="0" y="0" width="1200" height="6" fill="#c9a227"/>

  <g font-family="DejaVu Sans, Liberation Sans, sans-serif" fill="#e8e6e1">
    <text x="64" y="128" font-size="64" font-weight="bold">Diké <tspan fill="#8a8f98" font-weight="normal">for Hermes</tspan></text>
    <text x="64" y="188" font-size="27" fill="#c7c4bd">Checks every article citation in a Chilean legal brief</text>
    <text x="64" y="226" font-size="27" fill="#c7c4bd">against a sealed local copy of the law,</text>
    <text x="64" y="264" font-size="27" fill="#c9a227">and refuses to certify what it cannot prove.</text>

    <text x="64" y="488" font-size="20" fill="#8a8f98">25 Chilean statutes · offline after install</text>
    <text x="64" y="520" font-size="20" fill="#8a8f98">One Hermes tool, one slash command</text>
    <text x="64" y="552" font-size="20" fill="#8a8f98">github.com/Grizaceo/hermes-dike</text>
  </g>

  <g font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono, monospace" font-size="21" xml:space="preserve">
