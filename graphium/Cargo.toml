[package]
name = "dike-graphium"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Dike native adapter over Graphium CSR and layout"

[dependencies]
rayon = "1.10.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
